<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVoltix | Monitoramento de Utilidades</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #080f1c;
  --bg-soft: #0c1526;
  --panel: #101c30;
  --panel-2: #13233d;
  --panel-border: #1e3050;
  --text: #e8edf7;
  --text-muted: #8ba1c2;
  --accent: #5eead4;
  --accent-2: #38bdf8;
  --accent-dim: rgba(94,234,212,.11);
  --online: #34d399;
  --warning: #fbbf24;
  --danger: #f87171;
  --orange: #fb6a3d;
  --sidebar-w: 188px;
  --topbar-h: 48px;
  --radius: 8px;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
  background: #f3f7fb;
  color: #19334f;
  font-size: 13px;
}
html:has(body.dark), body.dark, body.dark .content, body.dark .view { background:#07101d; color:#dce9f6; }
body.dark .panel, body.dark .equipment-health, body.dark .home-context, body.dark .btn.ghost, body.dark .input, body.dark .select, body.dark .layout-drawer, body.dark .layout-drawer-item, body.dark .chart-fullscreen { background:#102035; color:#dce9f6; border-color:#29435f; }
body.dark .panel-hd, body.dark h1, body.dark .metric-line b, body.dark .power { color:#7dd3fc; }
body.dark .label, body.dark .muted, body.dark .health-detail { color:#a8bbd0; }
body.dark th { background:#172b43; color:#c4d5e8; }
body.dark tbody tr:nth-child(even) { background:#10243a; }
body.dark tbody tr:hover { background:#16344f; }
body.dark .seg { background:#1b344e; }
body.dark .layout-drawer-actions { background:#102035; }
button, input, select { font: inherit; }
button { cursor: pointer; }
.app { min-height: 100vh; display: flex; }
.sidebar {
  width: var(--sidebar-w);
  position: fixed;
  inset: 0 auto 0 0;
  background: linear-gradient(180deg, var(--panel), #0b1730);
  color: var(--text);
  display: flex;
  flex-direction: column;
  z-index: 20;
  box-shadow: 8px 0 24px rgba(8,15,28,.16);
}
.brand {
  min-height: 62px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 14px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.mark {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  background: var(--accent-dim);
  color: var(--accent);
  border: 1px solid rgba(94,234,212,.28);
}
.mark svg { width: 19px; height: 19px; }
.brand-name { font-size: 21px; font-weight: 800; letter-spacing: .01em; line-height: 1; }
.brand-sub { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
.area-switch {
  padding: 10px 14px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.area-label { display:block; margin:0 0 6px; color:#8ba1c2; font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
.area-select {
  width: 100%;
  border: 1px solid rgba(94,234,212,.35);
  background: #173b5d;
  color: #fff;
  border-radius: var(--radius);
  padding: 9px 10px;
  outline: 0;
  font-weight: 700;
}
.area-select:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(94,234,212,.15); }
.area-select option { background:#102a46; color:#fff; }
.nav { padding: 8px 0; flex: 1; overflow: auto; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 36px;
  padding: 0 14px;
  color: var(--text);
  border-left: 3px solid transparent;
  opacity: .88;
}
.nav-item:hover { background: rgba(94,234,212,.08); opacity: 1; }
.nav-item.active {
  background: rgba(94,234,212,.12);
  border-left-color: var(--accent);
  color: var(--accent);
  font-weight: 700;
}
.nav-item svg { width: 15px; height: 15px; flex: 0 0 auto; }
.nav-badge {
  margin-left: auto;
  background: var(--orange);
  color: white;
  border-radius: 7px;
  padding: 3px 7px;
  font-weight: 800;
}
.sidebar-footer {
  padding: 12px 14px;
  border-top: 1px solid rgba(255,255,255,.08);
  display: flex;
  align-items: center;
  gap: 9px;
}
.avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--accent);
  color: #06202c;
  display: grid;
  place-items: center;
  font-weight: 800;
}
.user-meta { min-width: 0; }
.user-meta b { display: block; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-meta span { display: block; font-size: 10px; color: var(--text-muted); }
.main {
  margin-left: var(--sidebar-w);
  min-height: 100vh;
  width: calc(100% - var(--sidebar-w));
}
.topbar {
  height: var(--topbar-h);
  background: var(--panel);
  color: var(--text);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 15;
}
.topbar-title { font-weight: 800; letter-spacing: .01em; }
.topbar-sub { color: var(--text-muted); border-left: 1px solid rgba(255,255,255,.16); padding-left: 10px; }
.topbar-spacer { flex: 1; }
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid rgba(94,234,212,.25);
  background: rgba(94,234,212,.1);
  color: var(--accent);
  border-radius: 999px;
  min-height: 24px;
  padding: 4px 10px;
  font-size: 11px;
  font-weight: 800;
}
.content { padding: 20px 24px 28px; }
.view { display: none; }
.view.active { display: block; }
.page-hd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 14px;
}
.title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
h1 {
  margin: 0;
  font-size: 28px;
  line-height: 1.1;
  font-weight: 600;
  color: #23628f;
}
.title-ico {
  width: 30px; height: 30px; border-radius: 50%;
  background: #23628f;
  color: white;
  display: inline-grid;
  place-items: center;
}
.title-ico svg { width: 17px; height: 17px; }
.toolbar, .filters {
  display: flex;
  align-items: end;
  gap: 8px;
  flex-wrap: wrap;
}
.field { min-width: 160px; flex: 1; }
.field.sm { max-width: 135px; min-width: 120px; }
.label {
  display: block;
  color: #5d6f86;
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  margin: 0 0 4px;
}
.input, .select {
  width: 100%;
  height: 31px;
  border: 1px solid #d5e0eb;
  background: white;
  border-radius: 6px;
  padding: 0 10px;
  color: #223952;
  outline: 0;
}
.input:focus, .select:focus { border-color: var(--accent-2); box-shadow: 0 0 0 3px rgba(56,189,248,.12); }
.btn {
  height: 32px;
  border: 0;
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 0 14px;
  font-weight: 800;
  color: white;
  background: #23628f;
}
.btn svg { width: 14px; height: 14px; }
.btn:hover { filter: brightness(1.06); }
.btn.accent { background: var(--accent); color: #05202b; }
.btn.orange { background: var(--orange); }
.btn.ghost { background: white; color: #23628f; border: 1px solid #cddceb; }
.btn.icon { width: 34px; padding: 0; }
.seg {
  display: inline-flex;
  background: #dfe9f3;
  border-radius: 999px;
  padding: 2px;
}
.seg button {
  height: 26px;
  border: 0;
  padding: 0 15px;
  border-radius: 999px;
  color: #23628f;
  background: transparent;
  font-weight: 800;
}
.seg button.active { background: var(--panel); color: white; }
.notice {
  min-height: 38px;
  display: flex;
  align-items: center;
  gap: 10px;
  background: #c9ecff;
  color: #23628f;
  border: 1px solid #aee1fb;
  padding: 9px 12px;
  border-radius: 4px;
  margin-bottom: 14px;
}
.notice svg { width: 15px; height: 15px; flex: 0 0 auto; }
.cards { display: grid; gap: 12px; }
.grid-4 { grid-template-columns: repeat(4, minmax(170px, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(220px, 1fr)); }
.grid-2 { grid-template-columns: repeat(2, minmax(280px, 1fr)); }
.kpi {
  min-height: 88px;
  display: grid;
  grid-template-columns: 58px 1fr;
  overflow: hidden;
  border-radius: var(--radius);
  background: #23628f;
  color: white;
  box-shadow: 0 1px 8px rgba(16,28,48,.16);
}
.kpi .ico {
  background: var(--panel);
  display: grid;
  place-items: center;
}
.kpi .ico svg { width: 27px; height: 27px; color: white; }
.kpi .body { padding: 13px 14px; }
.kpi .label { color: #cce4f8; margin-bottom: 4px; }
.kpi strong { display: block; font-size: 25px; line-height: 1; }
.kpi small { display: block; color: #d8edf9; font-size: 11px; margin-top: 7px; }
.panel {
  background: white;
  border: 1px solid #d8e2ec;
  border-radius: var(--radius);
  box-shadow: 0 1px 7px rgba(16,28,48,.08);
  overflow: hidden;
}
.panel-hd {
  min-height: 40px;
  padding: 10px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  color: #23628f;
  font-weight: 800;
  text-transform: uppercase;
}
.panel-body { padding: 14px; }
.chart-box { height: 255px; position: relative; }
.chart-box.tall { height: 315px; }
.empty {
  display: grid;
  place-items: center;
  min-height: 175px;
  color: #5d6f86;
  text-align: center;
}
.table-wrap { overflow: auto; }
table { width: 100%; border-collapse: collapse; min-width: 760px; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #e2ebf3; }
th {
  background: #e7eef6;
  color: #3c4f67;
  text-transform: uppercase;
  font-size: 11px;
  font-weight: 800;
}
tbody tr:nth-child(even) { background: #f4f9fc; }
tbody tr:hover { background: #edf8fb; }
.dashboard-row td { height: 42px; }
.power { color: #23628f; font-weight: 800; white-space: nowrap; }
.power svg { width: 13px; height: 13px; vertical-align: -2px; margin-right: 5px; }
.id-note { display: inline; margin-left: 8px; color: #7890aa; font-size: 11px; }
.status-dot {
  width: 9px; height: 9px; border-radius: 50%;
  display: inline-block;
  margin-right: 6px;
}
.status-dot.online { background: var(--online); }
.status-dot.warning { background: var(--warning); }
.status-dot.offline { background: var(--danger); }
.equipment-health {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 10px 12px;
  margin-bottom: 12px;
  border: 1px solid #d8e2ec;
  border-left: 4px solid var(--online);
  border-radius: var(--radius);
  background: white;
}
.equipment-health.meter-fault { border-left-color: var(--danger); }
.health-title { color: #19334f; font-weight: 800; margin-right: 4px; }
.health-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 25px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 800;
  white-space: nowrap;
}
.health-badge.online { color: #087a58; background: #d9f8ea; }
.health-badge.warning { color: #975d00; background: #fff1c8; }
.health-badge.offline { color: #ad2626; background: #ffe1e1; }
.health-detail { color: #5d6f86; font-size: 11px; }
.device-edit {
  width: 92px;
  justify-content: center;
  height: 25px;
  margin-left: 8px;
  padding: 0 8px;
  font-size: 10px;
  vertical-align: middle;
}
.equipment-cell { display:grid; grid-template-columns:minmax(0,1fr) 92px; align-items:center; gap:10px; min-width:270px; }
.equipment-name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.equipment-cell .device-edit { margin-left:0; }
.custom-grid { display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:12px; }
.custom-grid > .component { grid-column:span 4; }
.custom-grid > .component.medium { grid-column:span 6; }
.custom-grid > .component.wide { grid-column:span 12; }
.custom-grid > .component.kpi-component { grid-column:span 3; }
.home-context { display:flex; align-items:end; gap:8px; flex-wrap:wrap; padding:12px; margin-bottom:12px; background:#fff; border:1px solid #d8e2ec; border-radius:var(--radius); box-shadow:0 1px 7px rgba(16,28,48,.06); }
.home-context .field { min-width:155px; flex:0 1 230px; }
.home-context .context-spacer { flex:1; }
.home-kpi { cursor:pointer; transition:transform .16s ease, box-shadow .16s ease; }
.home-kpi:hover { transform:translateY(-2px); box-shadow:0 8px 18px rgba(16,28,48,.18); }
.home-chart-actions { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.chart-fullscreen { position:fixed; inset:20px; z-index:70; background:#fff; padding:16px; border-radius:12px; box-shadow:0 20px 50px rgba(0,0,0,.35); }
.chart-fullscreen .chart-box { height:calc(100vh - 130px); }
.widget-note { color:#607791; font-size:11px; line-height:1.45; }
.period-list { display:grid; gap:9px; }
.period-row { display:grid; grid-template-columns:82px 1fr 70px; align-items:center; gap:9px; font-size:12px; }
.period-bar { height:8px; overflow:hidden; border-radius:99px; background:#e8eff6; }
.period-bar > i { display:block; height:100%; background:#2f77a9; border-radius:inherit; }
.period-row strong { text-align:right; color:#23628f; }
.mini-table { max-height:300px; overflow:auto; }
.mini-table table { min-width:560px; }
.area-row { cursor:pointer; }
.area-row.selected { background:#e1f5fb !important; }
.measurement-status { white-space:nowrap; }
.home-modal { position:fixed; inset:0; z-index:90; display:grid; place-items:center; padding:16px; background:rgba(4,13,25,.55); }
.home-modal-card { width:min(720px,100%); max-height:85vh; overflow:auto; background:#fff; color:#19334f; border-radius:12px; box-shadow:0 22px 60px rgba(0,0,0,.32); }
.home-modal-head { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:15px 18px; border-bottom:1px solid #dce6ef; }
.home-modal-head h2 { margin:0; font-size:18px; color:#16395a; }
.home-modal-body { padding:18px; }
.layout-drawer-tabs { display:flex; gap:8px; margin:14px 0 10px; }
.layout-drawer-tabs span { padding:7px 10px; border-radius:999px; background:#e6eef6; color:#42617f; font-weight:800; font-size:11px; }
.layout-drawer-tabs span.active { background:#23628f; color:white; }
.component-meta { color:#71869d; display:block; font-size:10px; font-weight:500; margin-top:3px; }
.layout-mode .component { position:relative; cursor:grab; outline:2px dashed transparent; outline-offset:4px; min-width:0; }
.layout-mode .component:hover { outline-color:#38bdf8; }
.layout-mode .component.dragging { opacity:.45; }
.layout-mode .component.drag-over { outline-color:#16a6ba; background:#e6f8fb; }
.resize-handle { display:none; position:absolute; z-index:4; width:12px; height:12px; border:2px solid #fff; border-radius:3px; background:#2563a5; box-shadow:0 1px 4px rgba(0,0,0,.22); touch-action:none; }
.layout-mode .resize-handle { display:block; }
.resize-handle.nw { top:-6px; left:-6px; cursor:nwse-resize; }.resize-handle.ne { top:-6px; right:-6px; cursor:nesw-resize; }.resize-handle.sw { bottom:-6px; left:-6px; cursor:nesw-resize; }.resize-handle.se { right:-6px; bottom:-6px; cursor:nwse-resize; }
.layout-drawer-backdrop { position:fixed; inset:0; background:rgba(7,21,38,.28); z-index:60; }
.layout-drawer { position:fixed; z-index:61; top:0; right:0; width:min(390px,100vw); height:100vh; overflow:auto; background:#f5f8fc; box-shadow:-12px 0 30px rgba(10,27,54,.2); padding:20px; }
.layout-drawer-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding-bottom:16px; border-bottom:1px solid #dbe6ef; }
.layout-drawer-head h2 { margin:0; color:#142b44; font-size:20px; }
.layout-drawer-head p { margin:5px 0 0; color:#667c94; font-size:12px; }
.layout-drawer-list { display:grid; gap:9px; margin:16px 0; }
.layout-drawer-item { display:flex; align-items:center; gap:9px; background:white; border:1px solid #d8e2ec; border-radius:10px; padding:11px; }
.layout-drawer-item b { flex:1; color:#183958; font-size:13px; }
.layout-drawer-item select { width:82px; height:30px; }
.layout-drawer-item .drag-handle { color:#7690a8; font-size:18px; cursor:grab; }
.layout-drawer-actions { position:sticky; bottom:-20px; display:flex; gap:8px; padding:14px 0 4px; background:#f5f8fc; }
.dashboard-row { cursor: pointer; }
.alert-card {
  background: #23628f;
  color: white;
  border-radius: var(--radius);
  overflow: hidden;
}
.alert-card .alert-hd {
  background: var(--orange);
  padding: 12px 14px;
  font-weight: 800;
  display: flex;
  justify-content: space-between;
}
.alert-card .alert-body { padding: 24px 14px; min-height: 145px; }
.alert-card .alert-foot {
  background: var(--orange);
  padding: 9px 14px;
  display: flex;
  justify-content: space-between;
  font-size: 11px;
}
.gauge-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
.gauge { text-align: center; }
.gauge canvas { max-height: 180px; }
.gauge b { display: block; margin-bottom: 8px; }
.metric-list { display: grid; gap: 0; }
.metric-line {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 13px 0;
  border-bottom: 1px solid #e4edf5;
}
.metric-line:last-child { border-bottom: 0; }
.metric-line b { color: #23628f; font-size: 16px; }
.tabs { display: flex; gap: 22px; border-bottom: 1px solid #d8e2ec; margin-bottom: 14px; }
.tab {
  padding: 0 0 10px;
  color: #445a72;
  font-weight: 700;
  border-bottom: 2px solid transparent;
}
.tab.active { color: #23628f; border-color: #23628f; }
.form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; align-items: end; }
.billing-table input {
  height: 27px;
  border: 1px solid #cbd9e6;
  border-radius: 5px;
  padding: 0 8px;
}
.tree-layout { display: grid; grid-template-columns: 300px 1fr; gap: 18px; }
.tree {
  background: #e8f0f8;
  border: 1px solid #d3deea;
  border-radius: var(--radius);
  padding: 12px;
  max-height: 560px;
  overflow: auto;
}
.tree-search { margin-bottom: 12px; }
.tree-group { margin: 9px 0; font-weight: 800; color: #23628f; }
.tree-item {
  display: flex;
  align-items: center;
  gap: 7px;
  width: 100%;
  border: 0;
  background: transparent;
  text-align: left;
  padding: 5px 7px 5px 17px;
  border-radius: 5px;
  color: #36506b;
}
.tree-item.active, .tree-item:hover { background: white; }
.cfg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.section-title { color: #23628f; font-size: 18px; margin: 0 0 12px; font-weight: 500; }
.download-layout { display: grid; grid-template-columns: minmax(420px, 1fr) 310px; gap: 18px; align-items: start; }
.radio-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.radio-box {
  background: white;
  border: 1px solid #d8e2ec;
  border-radius: 5px;
  padding: 9px;
  display: flex;
  align-items: center;
  gap: 7px;
}
.summary-row { display: flex; gap: 10px; padding: 12px 0; border-bottom: 1px solid #d8e2ec; }
.summary-row svg { width: 16px; color: #23628f; }
.fab {
  position: fixed;
  right: 26px;
  bottom: 26px;
  width: 48px;
  height: 48px;
  border: 0;
  border-radius: 50%;
  background: var(--panel);
  color: white;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 28px rgba(8,15,28,.28);
  z-index: 25;
}
.fab svg { width: 21px; }
.toast {
  position: fixed;
  right: 24px;
  top: 62px;
  background: var(--panel);
  color: white;
  border: 1px solid var(--panel-border);
  border-radius: 8px;
  padding: 10px 12px;
  opacity: 0;
  transform: translateY(-8px);
  pointer-events: none;
  transition: .18s;
  z-index: 40;
}
.toast.show { opacity: 1; transform: translateY(0); }
.mobile-menu { display: none; }
@media (max-width: 980px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }

<script>
// Em produção, frontend e API são atendidos pelo mesmo domínio do Vercel.
const API = window.location.origin;
localStorage.setItem('svoltix_api', API);
let devices = [];
let historyRows = [];
let charts = {};
let groupNames = {};
let selectedDeviceId = localStorage.getItem('svoltix_device') || '';
let selectedCfgDevice = '';
let layoutsPorEquipamento = {};
let editandoLayout = false;
let temporizadorSalvarLayout = null;
let versaoSelecao = 0;
let versaoDemanda = 0;
let dataDemandaSelecionada = localStorage.getItem('svoltix_data_demanda') || today();
let grandezaHome = localStorage.getItem('svoltix_home_metric') || 'pt';
let visualizacaoHome = localStorage.getItem('svoltix_home_view') || 'area';
let leiturasHome = [];
let buscaDashboard = '';
let filtroComunicacaoDashboard = 'todos';
let filtroMedidorDashboard = 'todos';
const COMPONENTES_INICIAIS = [
  ['saude','Saude da instalacao','painel'], ['indicadores','Indicadores principais','painel'],
  ['grafico','Grafico de demanda','grafico'], ['tabelaDemanda','Tabela de demanda','tabela'],
  ['eficiencia','Eficiencia energetica','gauge'], ['metricas','Metricas de consumo','painel'],
  ['periodos','Consumo por periodo','painel'], ['alertas','Alertas','painel'],
  ['areas','Areas e equipamentos','tabela'], ['medicoes','Ultimas medicoes','tabela']
];
function tamanhoPadraoComponente(id){ return ['grafico','tabelaDemanda','areas','medicoes','indicadores','saude'].includes(id) ? 'largo' : 'normal'; }
function layoutPadrao(){ return { itens: COMPONENTES_INICIAIS.map(([id,nome,tipo]) => ({id,nome,tipo,visivel:true,tamanho:tamanhoPadraoComponente(id)})) }; }
function layoutAtual(){
  const id = ensureSelectedDevice();
  const salvo = layoutsPorEquipamento[id];
  if (!salvo?.itens) return layoutPadrao();
  const modelos = new Map(COMPONENTES_INICIAIS.map(([id,nome,tipo]) => [id,{ id,nome,tipo,visivel:true,tamanho:tamanhoPadraoComponente(id) }]));
  const itensSalvos = salvo.itens
    .filter(item => modelos.has(item.id))
    .map(item => ({ ...modelos.get(item.id), ...item }));
  const faltantes = COMPONENTES_INICIAIS
    .filter(([id]) => !itensSalvos.some(item => item.id === id))
    .map(([id]) => modelos.get(id));
  return { itens: [...itensSalvos, ...faltantes] };
}
async function carregarLayoutAtual(){
  const id = ensureSelectedDevice();
  if (!id) return;
  let cacheLocal = null;
  try { cacheLocal = JSON.parse(localStorage.getItem(chaveCacheLayout(id)) || 'null'); } catch {}
  try {
    const res = await fetch(`${API}/api/dashboard-layout/${encodeURIComponent(id)}`);
    const data = await res.json();
    layoutsPorEquipamento[id] = data.layout?.itens ? data.layout : (cacheLocal?.itens ? cacheLocal : layoutPadrao());
    guardarLayoutLocal(id, layoutsPorEquipamento[id]);
  } catch { layoutsPorEquipamento[id] = cacheLocal?.itens ? cacheLocal : (layoutsPorEquipamento[id] || layoutPadrao()); }
}
function chaveCacheLayout(id){ return `svoltix_layout_${id}`; }
function guardarLayoutLocal(id, layout){ localStorage.setItem(chaveCacheLayout(id), JSON.stringify(layout)); }
function alternarEditorLayout(){ editandoLayout = !editandoLayout; renderHome(); }
function alterarItemLayout(indice, campo, valor){
  const layout = layoutAtual();
  layout.itens[indice][campo] = campo === 'visivel' ? Boolean(valor) : valor;
  layoutsPorEquipamento[ensureSelectedDevice()] = layout;
  guardarLayoutLocal(ensureSelectedDevice(), layout);
  agendarSalvarLayout();
  renderHome();
}
function moverItemLayout(indice, direcao){
  const layout = layoutAtual(); const destino = indice + direcao;
  if (destino < 0 || destino >= layout.itens.length) return;
  [layout.itens[indice], layout.itens[destino]] = [layout.itens[destino], layout.itens[indice]];
  layoutsPorEquipamento[ensureSelectedDevice()] = layout;
  guardarLayoutLocal(ensureSelectedDevice(), layout);
  agendarSalvarLayout();
  renderHome();
}
function iniciarArrasteLayout(event, indice){ event.dataTransfer.setData('text/plain', String(indice)); event.currentTarget.classList.add('dragging'); }
function permitirSoltarLayout(event){ event.preventDefault(); event.currentTarget.classList.add('drag-over'); }
function limparSoltarLayout(event){ event.currentTarget.classList.remove('drag-over'); }
function soltarLayout(event, destino){
  event.preventDefault();
  const origem = Number(event.dataTransfer.getData('text/plain'));
  if (!Number.isInteger(origem) || origem === destino) return;
  const layout = layoutAtual();
  const [item] = layout.itens.splice(origem, 1);
  layout.itens.splice(destino, 0, item);
  layoutsPorEquipamento[ensureSelectedDevice()] = layout;
  guardarLayoutLocal(ensureSelectedDevice(), layout);
  agendarSalvarLayout();
  renderHome();
}
function finalizarArrasteLayout(){ document.querySelectorAll('.component').forEach(item => item.classList.remove('dragging','drag-over')); }
function iniciarRedimensionamentoLayout(event, indice){
  if (!editandoLayout) return;
  event.preventDefault(); event.stopPropagation();
  const componente = event.currentTarget.closest('.component');
  const inicioX = event.clientX;
  const tamanhoInicial = componente.classList.contains('wide') ? 'largo' : componente.classList.contains('medium') ? 'medio' : 'normal';
  const larguraInicial = componente.getBoundingClientRect().width;
  const atualizar = movimento => {
    const largura = larguraInicial + (movimento.clientX - inicioX);
    const tamanho = largura > window.innerWidth * .70 ? 'largo' : largura > window.innerWidth * .38 ? 'medio' : 'normal';
    componente.classList.toggle('wide', tamanho === 'largo');
    componente.classList.toggle('medium', tamanho === 'medio');
    componente.classList.toggle('resizing', true);
    componente.dataset.novoTamanho = tamanho;
  };
  const concluir = () => {
    window.removeEventListener('pointermove', atualizar);
    window.removeEventListener('pointerup', concluir);
    const tamanho = componente.dataset.novoTamanho || tamanhoInicial;
    componente.classList.remove('resizing');
    if (tamanho !== tamanhoInicial) alterarItemLayout(indice, 'tamanho', tamanho);
  };
  window.addEventListener('pointermove', atualizar);
  window.addEventListener('pointerup', concluir, { once:true });
}
function restaurarLayoutPadrao(){
  const id = ensureSelectedDevice();
  layoutsPorEquipamento[id] = layoutPadrao();
  guardarLayoutLocal(id, layoutsPorEquipamento[id]);
  agendarSalvarLayout();
  renderHome();
}
function agendarSalvarLayout(){
  clearTimeout(temporizadorSalvarLayout);
  temporizadorSalvarLayout = setTimeout(() => salvarLayout(true), 600);
}
async function salvarLayout(silencioso = false){
  const id = ensureSelectedDevice(); const layout = layoutAtual();
  try {
    const res = await fetch(`${API}/api/dashboard-layout/${encodeURIComponent(id)}`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({layout}) });
    if (!res.ok) throw new Error('layout');
    layoutsPorEquipamento[id] = layout;
    guardarLayoutLocal(id, layout);
    if (!silencioso) { editandoLayout = false; renderHome(); toast('Layout salvo para este equipamento'); }
  } catch { if (!silencioso) toast('Nao foi possivel salvar o layout'); }
}

const icons = {
  home: '<path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
  clock: '<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  chart: '<path d="M4 19V5M4 19h17M8 16V9M13 16V6M18 16v-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  search: '<circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  card: '<rect x="3" y="6" width="18" height="12" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18" stroke="currentColor" stroke-width="1.8"/>',
  gear: '<path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.04.04a2 2 0 1 1-2.83 2.83l-.04-.04A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6V20a2 2 0 1 1-4 0v-.06a1.7 1.7 0 0 0-1-.54 1.7 1.7 0 0 0-1.87.34l-.04.04a2 2 0 1 1-2.83-2.83l.04-.04A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1H4a2 2 0 1 1 0-4h.06a1.7 1.7 0 0 0 .54-1 1.7 1.7 0 0 0-.34-1.87l-.04-.04a2 2 0 1 1 2.83-2.83l.04.04A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6V4a2 2 0 1 1 4 0v.06a1.7 1.7 0 0 0 1 .54 1.7 1.7 0 0 0 1.87-.34l.04-.04a2 2 0 1 1 2.83 2.83l-.04.04A1.7 1.7 0 0 0 19.4 9c.22.33.42.66.6 1H20a2 2 0 1 1 0 4h-.06c-.15.36-.33.7-.54 1Z" stroke="currentColor" stroke-width="1.3"/>',
  bell: '<path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 7h18s-3 0-3-7M13.7 21a2 2 0 0 1-3.4 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  download: '<path d="M12 3v12M7 10l5 5 5-5M5 21h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
  file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z" stroke="currentColor" stroke-width="1.8"/><path d="M14 2v6h6" stroke="currentColor" stroke-width="1.8"/>',
  bolt: '<path d="M13 2 4 14h7l-1 8 10-12h-7l1-8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M16 3v4M8 3v4M3 11h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'
};
const navItems = [
  ['dashboards','Meus Dashboards','chart'],
  ['home','Home','home'],
  ['monitoramento','Monitoramento','clock'],
  ['historico','Historico','chart'],
  ['analise','Analise','search'],
  ['faturamento','Faturamento','card'],
  ['geracao','Minha Geracao','gear'],
  ['relatorios','Relatorios','file'],
  ['alertas','Alertas','bell','90'],
  ['downloads','Downloads','download'],
  ['config','Configuracoes','gear']
];
function svg(name){ return `<svg viewBox="0 0 24 24" fill="none">${icons[name]}</svg>`; }
function money(v){ return Number(v || 0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' }); }
function num(v, d=0){ return Number(v || 0).toLocaleString('pt-BR', { maximumFractionDigits:d, minimumFractionDigits:d }); }
function kwhFromW(w, hours=24){ return Math.max(0, Number(w || 0) * hours / 1000); }
function today(){ return new Date().toISOString().slice(0,10); }
function brDate(date=today()){ const [y,m,d] = date.slice(0,10).split('-'); return `${d}/${m}/${y}`; }
const GRANDEZAS_HOME = {
  pt:{ titulo:'Demanda', unidade:'kW', divisor:1000 }, pa:{ titulo:'Potencia fase A', unidade:'kW', divisor:1000 }, pb:{ titulo:'Potencia fase B', unidade:'kW', divisor:1000 }, pc:{ titulo:'Potencia fase C', unidade:'kW', divisor:1000 },
  qa:{ titulo:'Potencia reativa A', unidade:'kVAr', divisor:1000 }, st:{ titulo:'Potencia aparente', unidade:'kVA', divisor:1000 },
  va:{ titulo:'Tensao fase A', unidade:'V', divisor:1 }, vb:{ titulo:'Tensao fase B', unidade:'V', divisor:1 }, vc:{ titulo:'Tensao fase C', unidade:'V', divisor:1 },
  ia:{ titulo:'Corrente fase A', unidade:'A', divisor:1 }, ib:{ titulo:'Corrente fase B', unidade:'A', divisor:1 }, ic:{ titulo:'Corrente fase C', unidade:'A', divisor:1 },
  fpt:{ titulo:'Fator de potencia', unidade:'', divisor:1 }, hz:{ titulo:'Frequencia', unidade:'Hz', divisor:1 }
};
function metaGrandezaHome(){ return GRANDEZAS_HOME[grandezaHome] || GRANDEZAS_HOME.pt; }
function escapeHtml(valor){ return String(valor ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }
function alterarGrandezaHome(valor){ if (!GRANDEZAS_HOME[valor]) return; grandezaHome = valor; localStorage.setItem('svoltix_home_metric', valor); renderHome(); }
function alterarVisualizacaoHome(valor){ if (!['area','linha','barras'].includes(valor)) return; visualizacaoHome = valor; localStorage.setItem('svoltix_home_view', valor); renderHome(); }
function deslocarDataDemanda(dias){ const base = new Date(`${dataDemandaSelecionada}T12:00:00`); base.setDate(base.getDate() + dias); const alvo = base.toISOString().slice(0,10); if (alvo <= today()) setDataDemanda(alvo); }
function alternarTema(){ const escuro = !document.body.classList.contains('dark'); document.body.classList.toggle('dark', escuro); localStorage.setItem('svoltix_tema', escuro ? 'dark' : 'light'); renderHome(); }
function aplicarTemaSalvo(){ document.body.classList.toggle('dark', localStorage.getItem('svoltix_tema') === 'dark'); }
function horaLeitura(linha){ const data = new Date(linha.created_at); return Number.isNaN(data.getTime()) ? '--:--' : data.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function consumoKwhDasLeituras(linhas){
  const ordenadas = linhas.slice().sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
  return ordenadas.slice(1).reduce((soma, linha, indice) => {
    const anterior = ordenadas[indice];
    const intervalo = Math.max(0, (new Date(linha.created_at) - new Date(anterior.created_at)) / 3600000);
    return soma + (Number(anterior.pt || 0) / 1000) * Math.min(intervalo, 1);
  }, 0);
}
function abrirModalHome(titulo, conteudo){
  const anterior = document.getElementById('homeModal'); if (anterior) anterior.remove();
  document.body.insertAdjacentHTML('beforeend', `<div class="home-modal" id="homeModal" role="dialog" aria-modal="true" aria-label="${escapeHtml(titulo)}" onclick="if(event.target===this)fecharModalHome()"><section class="home-modal-card"><header class="home-modal-head"><h2>${escapeHtml(titulo)}</h2><button class="btn icon ghost" aria-label="Fechar" onclick="fecharModalHome()">×</button></header><div class="home-modal-body">${conteudo}</div></section></div>`);
}
function fecharModalHome(){ document.getElementById('homeModal')?.remove(); }
function exportarCsvHome(){
  const meta = metaGrandezaHome();
  const linhas = leiturasHome.map(l => `${l.created_at || ''};${Number(l[grandezaHome] || 0) / meta.divisor}`).join('\n');
  const blob = new Blob([`data_hora;${meta.titulo} (${meta.unidade})\n${linhas}`], {type:'text/csv;charset=utf-8'});
  const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `svoltix-${ensureSelectedDevice()}-${dataDemandaSelecionada}.csv`; link.click(); URL.revokeObjectURL(link.href);
}
function alternarTelaCheiaGrafico(){ document.getElementById('homeChartPanel')?.classList.toggle('chart-fullscreen'); setTimeout(resizeCharts, 50); }
document.addEventListener('keydown', event => { if (event.key === 'Escape') fecharModalHome(); });
function deviceId(d){ return d.device || d.dispositivo || d.id || 'SVX-EQUIPAMENTO'; }
function deviceName(d){
  const id = deviceId(d);
  return groupNames[id] || d.nome_grupo || id;
}
function contextoEquipamento(){
  const equipamento = currentDevice();
  return `<span class="pill">${deviceName(equipamento)}</span><span class="pill hide-sm">ID ${deviceId(equipamento)}</span>`;
}
function deviceList(){
  return devices.length ? devices : demoDevices();
}
function ensureSelectedDevice(){
  const list = deviceList();
  if (!list.length) return '';
  if (!selectedDeviceId || !list.some(d => deviceId(d) === selectedDeviceId)) {
    selectedDeviceId = deviceId(list[0]);
    localStorage.setItem('svoltix_device', selectedDeviceId);
  }
  return selectedDeviceId;
}
function currentDevice(){
  const id = ensureSelectedDevice();
  return deviceList().find(d => deviceId(d) === id) || deviceList()[0] || {};
}
async function setSelectedDevice(id, nextView = null){
  if (!id || !deviceList().some(device => deviceId(device) === id)) return;
  selectedDeviceId = id;
  selectedCfgDevice = id;
  localStorage.setItem('svoltix_device', id);
  const versaoAtual = ++versaoSelecao;
  await carregarLayoutAtual();
  if (versaoAtual !== versaoSelecao) return;
  renderAll();
  if (nextView) go(nextView);
  else syncSelectionControls();
}
function syncSelectionControls(){
  const id = ensureSelectedDevice();
  ['areaSelect','deviceSelect','histDevice','anaDevice'].forEach(selId => {
    const el = document.getElementById(selId);
    if (el && [...el.options].some(o => o.value === id)) el.value = id;
  });
}
function statusOf(d){
  if (!d.created_at) return 'offline';
  const age = (Date.now() - new Date(d.created_at).getTime()) / 1000;
  if (age < 35) return 'online';
  if (age < 90) return 'warning';
  return 'offline';
}
function editarNomeEquipamento(id){
  selectedDeviceId = id;
  selectedCfgDevice = id;
  localStorage.setItem('svoltix_device', id);
  renderAll();
  go('config');
}
function statusLabel(s){ return s === 'online' ? 'Online' : s === 'warning' ? 'Atencao' : 'Offline'; }
function meterStatusOf(d){
  const leituraValida = d.leituraMedidorValida;
  if (leituraValida === true || leituraValida === 'true' || d.statusMedidor === 'ok') return 'online';
  if (leituraValida === false || leituraValida === 'false' || d.statusMedidor === 'indisponivel') return 'offline';
  return 'warning';
}
function meterStatusLabel(d){
  const status = meterStatusOf(d);
  return status === 'online' ? 'Multimedidor operante' : status === 'offline' ? 'Multimedidor indisponivel' : 'Sem diagnostico do multimedidor';
}
function tempoSemLeitura(d){
  const segundos = Math.max(0, Number(d.tempoSemLeitura || 0));
  if (!segundos) return '';
  if (segundos < 60) return `${Math.floor(segundos)} s sem leitura valida`;
  if (segundos < 3600) return `${Math.floor(segundos / 60)} min sem leitura valida`;
  return `${Math.floor(segundos / 3600)} h sem leitura valida`;
}
function badgeSaude(classe, texto){
  return `<span class="health-badge ${classe}"><span class="status-dot ${classe}"></span>${texto}</span>`;
}
function resumoSaudeEquipamento(d){
  const comunicacao = statusOf(d);
  const medidor = meterStatusOf(d);
  const detalhe = tempoSemLeitura(d);
  return `<div class="equipment-health ${medidor === 'offline' ? 'meter-fault' : ''}">
    <span class="health-title">Situacao do equipamento</span>
    ${badgeSaude(comunicacao, `SVoltix ${statusLabel(comunicacao)}`)}
    ${badgeSaude(medidor, meterStatusLabel(d))}
    ${detalhe ? `<span class="health-detail">${detalhe}</span>` : ''}
  </div>`;
}
function totals(){
  const selected = currentDevice();
  const source = selected && deviceId(selected) ? [selected] : deviceList();
  const totalW = source.reduce((s,d)=>s + Number(d.pt || 0), 0);
  const todayKwh = kwhFromW(totalW, 1);
  const monthKwh = kwhFromW(totalW, 24 * 30);
  const fp = source.length ? source.reduce((s,d)=>s + Number(d.fpt || 0),0) / source.length : 0;
  const hz = source.length ? source.reduce((s,d)=>s + Number(d.hz || 0),0) / source.length : 0;
  const tc = source.length ? source.reduce((s,d)=>s + Number(d.tc || 0),0) / source.length : 0;

function makeLine(id, labels, datasets, yTitle='', tipo='line'){
  destroyChart(id);

  const grade = escuro ? '#263e58' : '#e1e9f2';
  charts[id] = new Chart(el, {
    type: tipo,
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode:'index', intersect:false },
      plugins: { legend: { position:'top', align:'end', labels: { color:texto, usePointStyle:true, pointStyle:'circle', boxWidth:7, boxHeight:7, padding:16, font:{ size:11, weight:'600' } } }, tooltip:{ padding:10, titleFont:{weight:'700'}, bodyFont:{weight:'600'} } },
      scales: {
        x: { grid: { color:grade }, ticks:{ color:texto, maxTicksLimit: 9 } },
        y: { beginAtZero:true, title:{ display:!!yTitle, text:yTitle, color:texto }, grid: { color:grade }, ticks:{ color:texto } }
      }
    }
  });
}
function makeGauge(id, value, max=10){
  destroyChart(id);
  const el = document.getElementById(id);
  if (!el || !window.Chart) return;
  charts[id] = new Chart(el, {
    type: 'doughnut',
    data: { datasets: [{ data: [Math.min(value,max), Math.max(max-value,0)], backgroundColor: ['#23628f','#e2ebf3'], borderWidth: 0, circumference: 220, rotation: 250 }] },
    options: { responsive:true, maintainAspectRatio:false, cutout:'58%', plugins:{ legend:{ display:false }, tooltip:{ enabled:false } } }
  });
}
function fakeSeries(field='pt', len=14){
  const base = currentDevice() || {};
  return Array.from({length: len}, (_,i) => {
    const val = Number(base[field] || base.pt || 0);
    return Math.max(0, val * (.65 + Math.sin(i/2) * .18 + (i % 3) * .04));
  });
}

function aplicarFiltrosNaTabelaDashboard(){
  const linhas = [...document.querySelectorAll('#dashboardTableBody tr[data-dashboard-row]')];
  let visiveis = 0;
  linhas.forEach(linha => {
    const corresponde = (!buscaDashboard || linha.dataset.search.includes(buscaDashboard))
      && (filtroComunicacaoDashboard === 'todos' || linha.dataset.communication === filtroComunicacaoDashboard)
      && (filtroMedidorDashboard === 'todos' || linha.dataset.meter === filtroMedidorDashboard);
    linha.hidden = !corresponde;
    if (corresponde) visiveis++;

  const contador = document.getElementById('dashboardFilterCount');
  if (contador) contador.textContent = `${visiveis} de ${linhas.length} equipamento(s)`;
  const vazio = document.getElementById('dashboardNoResults');

async function drawHomeLegado(){
  const versaoAtual = ++versaoDemanda;
  const equipamento = ensureSelectedDevice();
  const data = dataDemandaSelecionada;
  const labels = Array.from({length:24}, (_,hora)=>`${String(hora).padStart(2,'0')}h`);
  const valores = Array(24).fill(null);
  let linhas = [];
  try {
    const res = await fetch(`${API}/api/historico/${encodeURIComponent(equipamento)}?data=${encodeURIComponent(data)}&limit=10000`);
    if (!res.ok) throw new Error('historico');
    linhas = await res.json();
  } catch {}
  if (versaoAtual !== versaoDemanda) return;
  const porHora = Array.from({length:24}, () => []);
  linhas.forEach(linha => {
    const instante = new Date(linha.created_at);
    if (Number.isNaN(instante.getTime())) return;
    porHora[instante.getHours()].push(Number(linha.pt || 0) / 1000);
  });
  porHora.forEach((amostras, hora) => {
    if (amostras.length) valores[hora] = amostras.reduce((s, valor) => s + valor, 0) / amostras.length;
  });
  makeLine('homeDemand', labels, [{ label:'Demanda', data:valores, borderColor:'#23628f', backgroundColor:'rgba(35,98,143,.20)', tension:.35, fill:true, spanGaps:false }], 'kW');
  const consumoKwh = linhas.length > 1
    ? linhas.slice(1).reduce((soma, linha, indice) => {
        const anterior = linhas[indice];
        const intervaloHoras = Math.max(0, (new Date(linha.created_at) - new Date(anterior.created_at)) / 3600000);
        return soma + (Number(anterior.pt || 0) / 1000) * Math.min(intervaloHoras, 1);
      }, 0)
    : 0;
  const consumo = document.getElementById('homeConsumptionValue');
  if (consumo) consumo.textContent = `${num(consumoKwh,2)} kWh`;
  const status = document.getElementById('homeDemandStatus');
  if (status) status.textContent = linhas.length
    ? `${linhas.length} leituras utilizadas no dia selecionado.`
    : 'Não há leituras para o dia selecionado.';
  makeGauge('effGauge', 6.8, 10);
}
function resumoDasLeiturasHome(linhas){
  const ordenadas = linhas.slice().sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
  const consumo = consumoKwhDasLeituras(ordenadas);
  const potencias = ordenadas.map(l => Number(l.pt || 0) / 1000).filter(Number.isFinite);
  const maior = potencias.length ? Math.max(...potencias) : 0;
  const menor = potencias.length ? Math.min(...potencias) : 0;
  const media = potencias.length ? potencias.reduce((s,v)=>s+v,0)/potencias.length : 0;
  const periodos = [['Madrugada',0,6],['Manha',6,12],['Tarde',12,18],['Noite',18,24]].map(([nome,inicio,fim]) => {
    const grupo = ordenadas.filter(l => { const h = new Date(l.created_at).getHours(); return h >= inicio && h < fim; });
    return { nome, consumo:consumoKwhDasLeituras(grupo) };
  });
  return { ordenadas, consumo, maior, menor, media, periodos };
}
function preencherWidgetsHome(linhas){
  const selected = currentDevice();
  const resumo = resumoDasLeiturasHome(linhas);
  const consumo = document.getElementById('homeConsumptionValue'); if (consumo) consumo.textContent = `${num(resumo.consumo,2)} kWh`;
  const demanda = document.getElementById('homeDemandNow'); if (demanda) demanda.textContent = `${num(Number(selected.pt || 0)/1000,2)} kW`;
  const mensal = document.getElementById('homeMonthlyValue'); if (mensal) mensal.textContent = `${num(resumo.consumo * 30,0)} kWh`;
  const previsao = document.getElementById('homeForecastValue'); if (previsao) previsao.textContent = `${num(resumo.consumo * 33.6,0)} kWh`;
  const eficiencia = resumo.maior > 0 ? Math.min(10, Math.max(1, 10 - (resumo.maior / Math.max(resumo.media * 2, 1)) * 2)) : 0;
  makeGauge('effGauge', eficiencia, 10);
  const effValue = document.getElementById('effValue'); if (effValue) effValue.textContent = linhas.length ? `${num(eficiencia * 10,0)}%` : 'Sem dados';
  const effText = document.getElementById('effText'); if (effText) effText.textContent = !linhas.length ? 'Nao existem leituras para o periodo selecionado.' : eficiencia >= 7 ? 'Perfil dentro do padrao operacional recente.' : 'Verifique equipamentos com maior demanda no horario de pico.';
  const metrics = document.getElementById('homeMetrics');
  if (metrics) metrics.innerHTML = linhas.length ? [
    ['Consumo do dia', `${num(resumo.consumo,2)} kWh`], ['Demanda maxima', `${num(resumo.maior,2)} kW`], ['Demanda media', `${num(resumo.media,2)} kW`], ['Menor demanda', `${num(resumo.menor,2)} kW`], ['Fator de potencia', num(Number(selected.fpt || 0),2)]
  ].map(([nome,valor]) => `<div class="metric-line"><span>${nome}</span><b>${valor}</b></div>`).join('') : '<div class="empty">Sem dados para calcular metricas.</div>';
  const totalPeriodo = resumo.periodos.reduce((s,p)=>s+p.consumo,0);
  const periodos = document.getElementById('homePeriods');
  if (periodos) periodos.innerHTML = linhas.length ? resumo.periodos.map(p => { const percentual = totalPeriodo ? p.consumo/totalPeriodo*100 : 0; return `<div class="period-row"><span>${p.nome}</span><div class="period-bar"><i style="width:${percentual}%"></i></div><strong>${num(p.consumo,1)} kWh</strong></div>`; }).join('') : '<div class="empty">Sem distribuicao de consumo.</div>';
  const tabela = document.getElementById('homeDemandTable');
  if (tabela) {
    const porHora = Array.from({length:24},()=>[]); resumo.ordenadas.forEach(l => porHora[new Date(l.created_at).getHours()].push(Number(l.pt || 0)/1000));
    tabela.innerHTML = `<table><thead><tr><th>Hora</th><th>Demanda</th><th>Tarifa</th><th>Status</th></tr></thead><tbody>${porHora.map((amostras,hora) => { const valor = amostras.length ? amostras.reduce((s,v)=>s+v,0)/amostras.length : null; const ponta = hora >= 18 && hora < 21; return `<tr><td>${String(hora).padStart(2,'0')}:00</td><td>${valor === null ? '--' : `${num(valor,2)} kW`}</td><td>${ponta ? 'Ponta' : 'Fora ponta'}</td><td>${valor === null ? 'Sem leitura' : valor === resumo.maior ? 'Maxima' : 'Normal'}</td></tr>`; }).join('')}</tbody></table>`;
  }
  const medicoes = document.getElementById('homeMeasurements');
  if (medicoes) medicoes.innerHTML = linhas.length ? `<table><thead><tr><th>Data e hora</th><th>V A</th><th>V B</th><th>V C</th><th>I A</th><th>Potencia</th><th>FP</th><th>Status</th></tr></thead><tbody>${resumo.ordenadas.slice(-12).reverse().map(l => `<tr><td>${horaLeitura(l)}</td><td>${num(l.va,1)} V</td><td>${num(l.vb,1)} V</td><td>${num(l.vc,1)} V</td><td>${num(l.ia,2)} A</td><td>${num(Number(l.pt||0)/1000,2)} kW</td><td>${num(l.fpt,2)}</td><td class="measurement-status">${l.leituraMedidorValida === false ? 'Indisponivel' : 'Valida'}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">Nenhuma medicao no periodo selecionado.</div>';
  const areas = document.getElementById('homeAreasTable');
  if (areas) areas.innerHTML = `<table><thead><tr><th>Area / equipamento</th><th>Demanda</th><th>Multimedidor</th><th>Ultima atualizacao</th></tr></thead><tbody>${deviceList().map(d => { const id=deviceId(d); return `<tr class="area-row ${id===ensureSelectedDevice()?'selected':''}" onclick="setSelectedDevice('${id.replace(/'/g,"\\'")}')"><td><b>${escapeHtml(deviceName(d))}</b><span class="id-note">${id}</span></td><td>${num(Number(d.pt||0)/1000,2)} kW</td><td>${meterStatusLabel(d)}</td><td>${d.created_at ? horaLeitura(d) : '--'}</td></tr>`; }).join('')}</tbody></table>`;
}
function abrirResumoHome(tipo){
  const resumo = resumoDasLeiturasHome(leiturasHome);
  const conteudos = {
    demanda:`<p>Demanda maxima no dia selecionado: <b>${num(resumo.maior,2)} kW</b>.</p><p>Demanda media: <b>${num(resumo.media,2)} kW</b>.</p>`,
    consumo:`<p>Consumo integrado a partir das leituras recebidas em ${brDate(dataDemandaSelecionada)}: <b>${num(resumo.consumo,2)} kWh</b>.</p>`,
    mensal:`<p>Estimativa mensal baseada no consumo do dia selecionado: <b>${num(resumo.consumo * 30,0)} kWh</b>.</p>`,
    previsao:`<p>Previsao operacional baseada na media recente: <b>${num(resumo.consumo * 33.6,0)} kWh</b>.</p>`
  };
  abrirModalHome('Resumo do indicador', conteudos[tipo] || '<p>Sem detalhes disponiveis.</p>');
}
async function drawHome(){
  const versaoAtual = ++versaoDemanda;
  const equipamento = ensureSelectedDevice();
  const data = dataDemandaSelecionada;
  const meta = metaGrandezaHome();
  const labels = Array.from({length:24}, (_,hora)=>`${String(hora).padStart(2,'0')}h`);
  let linhas = [];
  try {
    const res = await fetch(`${API}/api/historico/${encodeURIComponent(equipamento)}?data=${encodeURIComponent(data)}&limit=10000`);
    if (!res.ok) throw new Error('historico');
    linhas = await res.json();
  } catch {}
  if (versaoAtual !== versaoDemanda) return;
  leiturasHome = Array.isArray(linhas) ? linhas : [];
  const porHora = Array.from({length:24}, () => []);
  leiturasHome.forEach(linha => { const instante = new Date(linha.created_at); if (!Number.isNaN(instante.getTime())) porHora[instante.getHours()].push(Number(linha[grandezaHome] || 0) / meta.divisor); });
  const valores = porHora.map(amostras => amostras.length ? amostras.reduce((s,v)=>s+v,0)/amostras.length : null);
  const tipo = visualizacaoHome === 'barras' ? 'bar' : 'line';
  makeLine('homeDemand', labels, [
    { label:meta.titulo, data:valores, borderColor:'#23628f', backgroundColor:visualizacaoHome==='area' ? 'rgba(35,98,143,.22)' : 'rgba(35,98,143,.68)', tension:.35, fill:visualizacaoHome==='area', spanGaps:false, borderWidth:2, pointRadius:visualizacaoHome === 'linha' ? 2 : 0, pointHoverRadius:4 }
  ], meta.unidade, tipo);
  preencherWidgetsHome(leiturasHome);
  const status = document.getElementById('homeDemandStatus');
  if (status) status.textContent = leiturasHome.length ? `${leiturasHome.length} leituras utilizadas. Ultima atualizacao: ${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}.` : 'Nao ha leituras para o dia selecionado.';
}
async function fetchHistoryByWindow(device, seconds, limit = 5000){
  const safeSeconds = Math.min(Math.max(parseInt(seconds, 10) || 30, 1), 30 * 24 * 3600);
  const res = await fetch(`${API}/api/historico/${encodeURIComponent(device)}?janela=${safeSeconds}&limit=${limit}`);
  if (!res.ok) throw new Error('historico');
  const rows = await res.json();
  if (!Array.isArray(rows) || !rows.length) return [];

  const dated = rows
    .filter(r => r.created_at && !isNaN(new Date(r.created_at).getTime()))
    .sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
  if (!dated.length) return rows;

  const latestTs = new Date(dated[dated.length - 1].created_at).getTime();
  const minTs = latestTs - safeSeconds * 1000;
  return dated.filter(r => new Date(r.created_at).getTime() >= minTs);
}
function rowsAsc(rows){
  return rows.slice().sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
}
function rowLabels(rows){
  return rows.map((r, i) => r.created_at ? new Date(r.created_at).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit', second:'2-digit' }) : String(i + 1));
}
async function drawMonitor(){
  const selected = document.getElementById('deviceSelect')?.value || ensureSelectedDevice();
  if (selected !== selectedDeviceId) {
    selectedDeviceId = selected;
    localStorage.setItem('svoltix_device', selected);
  }
  const metric = document.getElementById('metricSelect')?.value || 'pt';
  const windowInput = document.getElementById('monitorWindow');
  const seconds = Math.min(Math.max(parseInt(windowInput?.value, 10) || 30, 1), 30 * 24 * 3600);
  if (windowInput) windowInput.value = seconds;
  localStorage.setItem('svoltix_window_seconds', seconds);
  let rows = [];
  try {
    rows = await fetchHistoryByWindow(selectedDeviceId, seconds);
  } catch {
    rows = [currentDevice()];
  }
  const ordered = rowsAsc(rows.length ? rows : [currentDevice()]);
  const labels = rowLabels(ordered);
  const total = ordered.map(r => Number(r[metric] ?? r.pt ?? 0));
  makeLine('monitorLine', labels, [
    { label:'Total', data: total, borderColor:'#23628f', tension:.35 },
    { label:'Fase A', data: ordered.map(r => Number(r.pa ?? r.va ?? 0)), borderColor:'#fbbf24', tension:.35 },
    { label:'Fase B', data: ordered.map(r => Number(r.pb ?? r.vb ?? 0)), borderColor:'#34d399', tension:.35 },
    { label:'Fase C', data: ordered.map(r => Number(r.pc ?? r.vc ?? 0)), borderColor:'#f87171', tension:.35 }
  ], 'Potencia');
  const latest = ordered[ordered.length - 1] || currentDevice();
  const gaugeValues = [
    Number(latest.pt || 0) / 1000,
    Number(latest.pa || 0) / 1000,
    Number(latest.pb || 0) / 1000,
    Number(latest.pc || 0) / 1000
  ];
  gaugeValues.forEach((v, i) => {
    makeGauge(`gauge${i}`, Math.max(0.01, Math.abs(v)), 10);
    const el = document.getElementById(`gaugeVal${i}`);
    if (el) el.textContent = `${num(v,2)} kW`;
  });
}
async function loadHistory(){
  const dev = document.getElementById('histDevice')?.value || ensureSelectedDevice();
  if (dev !== selectedDeviceId) {
    selectedDeviceId = dev;
    localStorage.setItem('svoltix_device', dev);
  }
  const metric = document.getElementById('histMetric')?.value || 'pt';
  const seconds = Math.min(Math.max(parseInt(document.getElementById('histWindow')?.value, 10) || 300, 1), 30 * 24 * 3600);
  localStorage.setItem('svoltix_window_seconds', seconds);
  const out = document.getElementById('histOutput');
  out.className = '';
  out.innerHTML = panel(`Resultado historico - ${deviceName(currentDevice())} - ultimos ${seconds}s`, '<div class="chart-box tall"><canvas id="histChart"></canvas></div>');
  try {
    const rows = await fetchHistoryByWindow(dev, seconds);
    historyRows = Array.isArray(rows) && rows.length ? rows : demoDevices();
  } catch { historyRows = demoDevices(); }
  const ordered = rowsAsc(historyRows);
  const labels = rowLabels(ordered);
  const data = ordered.map(r => Number(r[metric] || r.pt || 0));
  makeLine('histChart', labels, [{ label: metric.toUpperCase(), data, borderColor:'#23628f', backgroundColor:'rgba(35,98,143,.08)', fill:true, tension:.3 }], metric);
}
async function drawAnalysis(){
  const dev = document.getElementById('anaDevice')?.value || ensureSelectedDevice();
  if (dev !== selectedDeviceId) {
    selectedDeviceId = dev;
    localStorage.setItem('svoltix_device', dev);
  }
  let rows = [];
  try { rows = await fetchHistoryByWindow(selectedDeviceId, localStorage.getItem('svoltix_window_seconds') || 300); }
  catch { rows = [currentDevice()]; }
  const ordered = rowsAsc(rows.length ? rows : [currentDevice()]);
  const values = ordered.map(r => Number(r.pt || 0));
  const avg = values.length ? values.reduce((a,b)=>a+b,0) / values.length : 0;
  const out = document.getElementById('analysisOutput');
  out.className = '';
  out.innerHTML = `<div class="cards grid-2">${panel(`Curva de consumo - ${deviceName(currentDevice())}`, '<div class="chart-box"><canvas id="analysisChart"></canvas></div>')}${panel('Resumo', `<div class="metric-list"><div class="metric-line"><span>Media</span><b>${num(avg/1000,2)} kW</b></div><div class="metric-line"><span>Pico</span><b>${num((Math.max(...values,0))/1000,2)} kW</b></div><div class="metric-line"><span>Fator de potencia</span><b>${num(totals().fp,2)}</b></div></div>`)}</div>`;
  makeLine('analysisChart', rowLabels(ordered), [{ label:'Consumo', data:values, borderColor:'#23628f', tension:.35 }], 'W');
}
function drawGeneration(){
  const out = document.getElementById('generationOutput');
  out.className = '';
  out.innerHTML = panel('Geracao por periodo', '<div class="chart-box"><canvas id="generationChart"></canvas></div>');
  makeLine('generationChart', Array.from({length:12}, (_,i)=>`${i+6}h`), [{ label:'Geracao', data:fakeSeries('pt',12).map(v=>v*.42), borderColor:'#34d399', backgroundColor:'rgba(52,211,153,.1)', fill:true, tension:.35 }], 'W');
}
function exportCSV(){
  const rows = historyRows.length ? historyRows : devices;
  const cols = ['created_at','device','va','vb','vc','ia','ib','ic','pa','pb','pc','pt','fpt','hz','tc'];
  const csv = [cols.join(','), ...rows.map(r => cols.map(c => `"${String(r[c] ?? '').replace(/"/g,'""')}"`).join(','))].join('\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `svoltix_export_${today()}.csv`;
  a.click();
  a.remove();
  toast('CSV exportado');
}
function saveSettings(){
  const name = document.getElementById('cfgAreaName')?.value.trim();
  const goal = document.getElementById('cfgGoal')?.value;
  if (goal) localStorage.setItem('svoltix_goal', goal);
  if (!selectedCfgDevice || !name) { toast('Informe o nome da area'); return; }
  groupNames[selectedCfgDevice] = name;
  fetch(`${API}/grupos`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ dispositivo: selectedCfgDevice, nome_grupo: name })
  })
    .then(r => {
      if (!r.ok) throw new Error('save');
      toast('Nome salvo no banco');
      renderAll();
      go('config');
    })
    .catch(() => toast('Nao foi possivel salvar no banco'));
}
function selectCfgDevice(id){
  selectedCfgDevice = id;
  renderConfig();
}
function sair(){
  localStorage.removeItem('logado');
  location.href = 'index.html';
}
function init(){
  aplicarTemaSalvo();
  document.getElementById('userName').textContent = localStorage.getItem('usuario') || 'IST EFICIENCIA';
  renderNav();
  loadGroupNames().then(() => refreshData(true));
  setInterval(() => refreshData(false), 30000);
}
init();
</script>
