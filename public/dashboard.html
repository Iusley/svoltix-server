function layoutAtual(){
  const id = ensureSelectedDevice();

  const itensSalvos = salvo.itens
    .filter(item => modelos.has(item.id))
    .map(item => ({ ...modelos.get(item.id), ...item }));
  const faltantes = COMPONENTES_INICIAIS
    .filter(([id]) => !itensSalvos.some(item => item.id === id))
    .map(([id]) => modelos.get(id));
  return { itens: [...itensSalvos, ...faltantes] };
}
async function carregarLayoutAtual(){
  const id = ensureSelectedDevice();
  if (!id) return;
  let cacheLocal = null;
  try { cacheLocal = JSON.parse(localStorage.getItem(chaveCacheLayout(id)) || 'null'); } catch {}
  try {
    const res = await fetch(`${API}/api/dashboard-layout/${encodeURIComponent(id)}`);
    const data = await res.json();
    layoutsPorEquipamento[id] = data.layout?.itens ? data.layout : (cacheLocal?.itens ? cacheLocal : layoutPadrao());
    guardarLayoutLocal(id, layoutsPorEquipamento[id]);
  } catch { layoutsPorEquipamento[id] = cacheLocal?.itens ? cacheLocal : (layoutsPorEquipamento[id] || layoutPadrao()); }

function chaveCacheLayout(id){ return `svoltix_layout_${id}`; }

}
function moverItemLayout(indice, direcao){
  const layout = layoutAtual(); const destino = indice + direcao;

  [layout.itens[indice], layout.itens[destino]] = [layout.itens[destino], layout.itens[indice]];
  layoutsPorEquipamento[ensureSelectedDevice()] = layout;
  guardarLayoutLocal(ensureSelectedDevice(), layout);
  agendarSalvarLayout();
  renderHome();
}
function iniciarArrasteLayout(event, indice){
  indiceArrasteLayout = indice;

  event.dataTransfer.setData('text/plain', String(indice));
  event.currentTarget.classList.add('dragging');
}
function permitirSoltarLayout(event){
  event.preventDefault();
  event.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.layout-mode .component.drag-over').forEach(item => item !== event.currentTarget && item.classList.remove('drag-over'));
  event.currentTarget.classList.add('drag-over');
}
function limparSoltarLayout(event){
  if (!event.currentTarget.contains(event.relatedTarget)) event.currentTarget.classList.remove('drag-over');
}
function soltarLayout(event, destino){
  event.preventDefault();
  const recebido = event.dataTransfer.getData('text/plain');
  const origem = Number.isInteger(indiceArrasteLayout) ? indiceArrasteLayout : Number(recebido);
  if (!Number.isInteger(origem) || origem === destino) return;
  const layout = layoutAtual();
  const [item] = layout.itens.splice(origem, 1);
  layout.itens.splice(destino, 0, item);
  layoutsPorEquipamento[ensureSelectedDevice()] = layout;
  guardarLayoutLocal(ensureSelectedDevice(), layout);
  agendarSalvarLayout();
  renderHome();
}
function finalizarArrasteLayout(){
  indiceArrasteLayout = null;
  document.querySelectorAll('.component').forEach(item => item.classList.remove('dragging','drag-over'));
}
function iniciarRedimensionamentoLayout(event, indice){
  if (!editandoLayout) return;
  event.preventDefault(); event.stopPropagation();
  const componente = event.currentTarget.closest('.component');
  const inicioX = event.clientX;
  const tamanhoInicial = componente.classList.contains('wide') ? 'largo' : componente.classList.contains('medium') ? 'medio' : 'normal';
  const larguraInicial = componente.getBoundingClientRect().width;
  const atualizar = movimento => {
    const largura = larguraInicial + (movimento.clientX - inicioX);
    const tamanho = largura > window.innerWidth * .70 ? 'largo' : largura > window.innerWidth * .38 ? 'medio' : 'normal';
    componente.classList.toggle('wide', tamanho === 'largo');
    componente.classList.toggle('medium', tamanho === 'medio');
    componente.classList.toggle('resizing', true);
    componente.dataset.novoTamanho = tamanho;
  };
  const concluir = () => {
    window.removeEventListener('pointermove', atualizar);
    window.removeEventListener('pointerup', concluir);
    const tamanho = componente.dataset.novoTamanho || tamanhoInicial;
    componente.classList.remove('resizing');
    if (tamanho !== tamanhoInicial) alterarItemLayout(indice, 'tamanho', tamanho);
  };
  window.addEventListener('pointermove', atualizar);
  window.addEventListener('pointerup', concluir, { once:true });
}
function restaurarLayoutPadrao(){
  const id = ensureSelectedDevice();
  layoutsPorEquipamento[id] = layoutPadrao();
  guardarLayoutLocal(id, layoutsPorEquipamento[id]);
  agendarSalvarLayout();

}
function agendarSalvarLayout(){
  clearTimeout(temporizadorSalvarLayout);
  temporizadorSalvarLayout = setTimeout(() => salvarLayout(true), 600);
}
async function salvarLayout(silencioso = false){
  const id = ensureSelectedDevice(); const layout = layoutAtual();
  try {
    const res = await fetch(`${API}/api/dashboard-layout/${encodeURIComponent(id)}`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({layout}) });
    if (!res.ok) throw new Error('layout');
    layoutsPorEquipamento[id] = layout;
    guardarLayoutLocal(id, layout);
    if (!silencioso) { editandoLayout = false; renderHome(); toast('Layout salvo para este equipamento'); }

}

function consumoKwhDasLeituras(linhas){
  const ordenadas = linhas.slice().sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
  return ordenadas.slice(1).reduce((soma, linha, indice) => {
    const anterior = ordenadas[indice];
    const intervalo = Math.max(0, (new Date(linha.created_at) - new Date(anterior.created_at)) / 3600000);
    return soma + (Number(anterior.pt || 0) / 1000) * Math.min(intervalo, 1);
  }, 0);
}

function totals(){
  const selected = currentDevice();
  const source = selected && deviceId(selected) ? [selected] : deviceList();
  const totalW = source.reduce((s,d)=>s + Number(d.pt || 0), 0);
  const todayKwh = kwhFromW(totalW, 1);
  const monthKwh = kwhFromW(totalW, 24 * 30);
  const fp = source.length ? source.reduce((s,d)=>s + Number(d.fpt || 0),0) / source.length : 0;
  const hz = source.length ? source.reduce((s,d)=>s + Number(d.hz || 0),0) / source.length : 0;
  const tc = source.length ? source.reduce((s,d)=>s + Number(d.tc || 0),0) / source.length : 0;
  return { totalW, todayKwh, monthKwh, forecast: monthKwh * 1.12, fp, hz, tc };
}

function valorNumericoDaMedicao(linha, campos){
  for (const campo of campos) {
    const valor = Number(linha?.[campo]);
    if (Number.isFinite(valor)) return valor;
  }
  return null;
}
function valoresDaGrandeza(linha, metrica){
  const definicao = METRICAS_MONITORAMENTO[metrica] || METRICAS_MONITORAMENTO.pt;
  const fasesBrutas = definicao.fases.map(campos => valorNumericoDaMedicao(linha, campos));
  const fases = fasesBrutas.map(valor => (valor ?? 0) * definicao.escala);
  const totalBruto = valorNumericoDaMedicao(linha, definicao.total);
  const fasesValidas = fasesBrutas.filter(valor => valor !== null);
  const calculado = definicao.regra === 'media'
    ? (fasesValidas.length ? fasesValidas.reduce((soma, valor) => soma + valor, 0) / fasesValidas.length : 0)
    : fasesValidas.reduce((soma, valor) => soma + valor, 0);
  return { total:(totalBruto ?? calculado) * definicao.escala, fases, definicao };
}

function dispositivoDoMapa(item){ return deviceList().find(dispositivo => deviceId(dispositivo) === item.dispositivo); }
function statusMapa(item){
  const dispositivo = dispositivoDoMapa(item);
  if (dispositivo) return statusOf(dispositivo);
  const instante = new Date(item.ultima_leitura);
  if (Number.isNaN(instante.getTime())) return 'sem_dados';
  const idade = (Date.now() - instante.getTime()) / 1000;
  if (idade < 35) return 'online';
  if (idade < 90) return 'atencao';
  return 'offline';
}
function statusMapaLabel(status){ return status === 'sem_dados' ? 'Sem telemetria' : statusLabel(status); }
function statusMedidorMapa(item){
  const dispositivo = dispositivoDoMapa(item);
  if (dispositivo) return meterStatusOf(dispositivo);
  const leituraValida = String(item.leitura_medidor_valida ?? '').toLowerCase();
  const status = String(item.status_medidor ?? '').toLowerCase();
  if (leituraValida === 'true' || status === 'ok') return 'online';
  if (leituraValida === 'false' || status === 'indisponivel') return 'offline';
  return item.ultima_leitura ? 'atencao' : 'sem_dados';
}
function statusMedidorMapaLabel(status){
  if (status === 'online') return 'Multimedidor operante';
  if (status === 'offline') return 'Multimedidor indisponivel';
  if (status === 'atencao') return 'Sem diagnostico do multimedidor';
  return 'Sem telemetria do multimedidor';
}
function situacaoMarcadorMapa(item){
  const comunicacao = statusMapa(item);
  if (comunicacao !== 'online') return 'offline';
  return statusMedidorMapa(item) === 'online' ? 'online' : 'atencao';
}
function nomeMapa(item){
  const dispositivo = deviceList().find(d => deviceId(d) === item.dispositivo);
  return dispositivo ? deviceName(dispositivo) : item.dispositivo;
}
function localidadeMapa(item){
  if (item.cidade || item.estado) return { cidade:item.cidade || '', estado:item.estado || '' };
  const partes = String(item.endereco || '').split(',').map(parte => parte.trim()).filter(Boolean);
  const indiceBrasil = partes.findIndex(parte => /^brasil$/i.test(parte));
  const antesDoPais = indiceBrasil >= 0 ? partes.slice(0, indiceBrasil) : partes;
  return { cidade:antesDoPais.at(-3) || '', estado:antesDoPais.at(-2) || '' };
}
function cidadesMapa(){ return [...new Set(dadosMapaEquipamentos.map(item => localidadeMapa(item).cidade).filter(Boolean))].sort((a,b) => a.localeCompare(b,'pt-BR')); }
function estadosMapa(){ return [...new Set(dadosMapaEquipamentos.map(item => localidadeMapa(item).estado).filter(Boolean))].sort((a,b) => a.localeCompare(b,'pt-BR')); }
function pontosMapaFiltrados(){
  const busca = filtrosMapa.busca.toLowerCase();
  return dadosMapaEquipamentos.filter(item => {
    const localidade = localidadeMapa(item);
    const texto = `${nomeMapa(item)} ${item.dispositivo} ${item.endereco || ''} ${localidade.cidade} ${localidade.estado}`.toLowerCase();
    const noPeriodo = !(filtrosMapa.inicio || filtrosMapa.fim) || Number(item.total_leituras || 0) > 0;
    return coordenadasValidas(item.latitude, item.longitude) && noPeriodo
      && (!busca || texto.includes(busca))
      && (!filtrosMapa.cidade || localidade.cidade === filtrosMapa.cidade)
      && (!filtrosMapa.estado || localidade.estado === filtrosMapa.estado)
      && (filtrosMapa.status === 'todos' || situacaoMarcadorMapa(item) === filtrosMapa.status);
  });
}

function posicaoPadraoRotulo(indice){
  const posicoes = [[0,-8],[0,29],[-132,-8],[-132,29],[16,-35],[-149,52]];
  return posicoes[indice % posicoes.length];
}
function escalaRotuloMapa(){
  if (!mapaEquipamentos) return 1;
  return Math.max(.78, Math.min(1.18, .78 + ((mapaEquipamentos.getZoom() - 5) * .08)));
}
function fatorDeslocamentoRotuloMapa(){
  if (!mapaEquipamentos) return 1;
  return Math.max(.48, Math.min(1.34, Math.pow(2, (mapaEquipamentos.getZoom() - 9) * .18)));
}
function deslocamentoVisualRotuloMapa(deslocamento){
  const fator = fatorDeslocamentoRotuloMapa();
  return { x:Math.round(Number(deslocamento.x || 0) * fator), y:Math.round(Number(deslocamento.y || 0) * fator) };
}
function salvarDeslocamentosRotulosMapa(){
  localStorage.setItem('svoltix_mapa_deslocamentos_rotulos', JSON.stringify(deslocamentosRotulosMapa));
}
function habilitarArrasteRotulo(marcador, dispositivo, deslocamento){
  marcador.on('add', () => {
    const rotulo = marcador.getElement()?.querySelector('.svoltix-map-label');
    if (!rotulo || rotulo.dataset.arrastavel) return;
    rotulo.dataset.arrastavel = 'true';
    rotulo.addEventListener('pointerdown', evento => {
      const inicioX = evento.clientX; const inicioY = evento.clientY;
      const atual = deslocamentosRotulosMapa[dispositivo] || {x:deslocamento[0], y:deslocamento[1]};
      const fator = fatorDeslocamentoRotuloMapa();
      const visual = deslocamentoVisualRotuloMapa(atual);
      rotulo.setPointerCapture?.(evento.pointerId);
      const mover = movimento => {
        deslocamentosRotulosMapa[dispositivo] = { x:Math.round((visual.x + movimento.clientX - inicioX) / fator), y:Math.round((visual.y + movimento.clientY - inicioY) / fator) };
        const atualVisual = deslocamentoVisualRotuloMapa(deslocamentosRotulosMapa[dispositivo]);
        rotulo.style.setProperty('--nome-x', `${atualVisual.x}px`);
        rotulo.style.setProperty('--nome-y', `${atualVisual.y}px`);
      };
      const concluir = () => {
        salvarDeslocamentosRotulosMapa();
        window.removeEventListener('pointermove', mover);
        window.removeEventListener('pointerup', concluir);
      };
      window.addEventListener('pointermove', mover);
      window.addEventListener('pointerup', concluir, {once:true});
      evento.preventDefault(); evento.stopPropagation();
    });
  });
}

    const deslocamento = deslocamentosRotulosMapa[item.dispositivo] || {x:deslocamentoBase[0], y:deslocamentoBase[1]};

  } catch {}

    porHora[instante.getHours()].push(Number(linha.pt || 0) / 1000);
  });

  makeGauge('effGauge', 6.8, 10);

function resumoDasLeiturasHome(linhas){
  const ordenadas = linhas.slice().sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
  const consumo = consumoKwhDasLeituras(ordenadas);
  const potencias = ordenadas.map(l => Number(l.pt || 0) / 1000).filter(Number.isFinite);
  const maior = potencias.length ? Math.max(...potencias) : 0;
  const menor = potencias.length ? Math.min(...potencias) : 0;
  const media = potencias.length ? potencias.reduce((s,v)=>s+v,0)/potencias.length : 0;
  const periodos = [['Madrugada',0,6],['Manha',6,12],['Tarde',12,18],['Noite',18,24]].map(([nome,inicio,fim]) => {
    const grupo = ordenadas.filter(l => { const h = new Date(l.created_at).getHours(); return h >= inicio && h < fim; });
    return { nome, consumo:consumoKwhDasLeituras(grupo) };
  });
  return { ordenadas, consumo, maior, menor, media, periodos };
}

  const porHora = Array.from({length:24}, () => []);
  leiturasHome.forEach(linha => { const instante = new Date(linha.created_at); if (!Number.isNaN(instante.getTime())) porHora[instante.getHours()].push(Number(linha[grandezaHome] || 0) / meta.divisor); });
  const valores = porHora.map(amostras => amostras.length ? amostras.reduce((s,v)=>s+v,0)/amostras.length : null);
  const tipo = visualizacaoHome === 'barras' ? 'bar' : 'line';
  makeLine('homeDemand', labels, [
    { label:meta.titulo, data:valores, borderColor:'#23628f', backgroundColor:visualizacaoHome==='area' ? 'rgba(35,98,143,.22)' : 'rgba(35,98,143,.68)', tension:.35, fill:visualizacaoHome==='area', spanGaps:false, borderWidth:2, pointRadius:visualizacaoHome === 'linha' ? 2 : 0, pointHoverRadius:4 }
  ], meta.unidade, tipo);
  preencherWidgetsHome(leiturasHome);
  const status = document.getElementById('homeDemandStatus');
  if (status) status.textContent = leiturasHome.length ? `${leiturasHome.length} leituras utilizadas. Ultima atualizacao: ${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}.` : 'Nao ha leituras para o dia selecionado.';
}
async function fetchHistoryByWindow(device, seconds, limit = 5000){
  const safeSeconds = Math.min(Math.max(parseInt(seconds, 10) || 30, 1), 30 * 24 * 3600);
  const res = await fetch(`${API}/api/historico/${encodeURIComponent(device)}?janela=${safeSeconds}&limit=${limit}`);
  if (!res.ok) throw new Error('historico');
  const rows = await res.json();
  if (!Array.isArray(rows) || !rows.length) return [];

  const dated = rows
    .filter(r => r.created_at && !isNaN(new Date(r.created_at).getTime()))
    .sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
  if (!dated.length) return rows;

  const latestTs = new Date(dated[dated.length - 1].created_at).getTime();
  const minTs = latestTs - safeSeconds * 1000;
  return dated.filter(r => new Date(r.created_at).getTime() >= minTs);
}
function rowsAsc(rows){
  return rows.slice().sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
}
function rowLabels(rows){
  return rows.map((r, i) => r.created_at ? new Date(r.created_at).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit', second:'2-digit' }) : String(i + 1));
}
async function drawMonitor(){
  const metric = document.getElementById('metricSelect')?.value || 'pt';
  const windowInput = document.getElementById('monitorWindow');
  const minutos = Math.min(Math.max(parseInt(windowInput?.value, 10) || 30, 1), 43200);
  const seconds = minutos * 60;
  if (windowInput) windowInput.value = minutos;
  localStorage.setItem('svoltix_monitor_metric', metric);
  localStorage.setItem('svoltix_monitor_minutes', minutos);
  const definicao = METRICAS_MONITORAMENTO[metric] || METRICAS_MONITORAMENTO.pt;
  const status = document.getElementById('monitorStatus');
  if (status) status.textContent = 'Atualizando leituras...';
  let rows = [];
  try {
    rows = await fetchHistoryByWindow(ensureSelectedDevice(), seconds);
  } catch {
    rows = [];
  }
  const possuiHistorico = rows.length > 0;
  const ordered = rowsAsc(possuiHistorico ? rows : [currentDevice()]);
  leiturasMonitor = ordered;
  const labels = rowLabels(ordered);
  const valores = ordered.map(linha => valoresDaGrandeza(linha, metric));
  makeLine('monitorLine', labels, [
    { label:'Total', data: valores.map(item => item.total), borderColor:'#23628f', backgroundColor:'rgba(35,98,143,.10)', fill:true, tension:.35 },
    { label:'Fase A', data: valores.map(item => item.fases[0]), borderColor:'#fbbf24', tension:.35 },
    { label:'Fase B', data: valores.map(item => item.fases[1]), borderColor:'#34d399', tension:.35 },
    { label:'Fase C', data: valores.map(item => item.fases[2]), borderColor:'#f87171', tension:.35 }
  ], definicao.unidade || definicao.titulo);
  const latest = ordered[ordered.length - 1] || currentDevice();
  const valoresAtuais = valoresDaGrandeza(latest, metric);
  const gaugeValues = [valoresAtuais.total, ...valoresAtuais.fases];
  const pico = Math.max(...valores.flatMap(item => [item.total, ...item.fases]).map(valor => Math.abs(valor)), 0);
  const maximoGauge = Math.max(definicao.maximo, Math.ceil(pico * 1.15 * 10) / 10, 0.01);
  gaugeValues.forEach((v, i) => {
    makeGauge(`gauge${i}`, Math.max(0.01, Math.abs(v)), maximoGauge);
    const el = document.getElementById(`gaugeVal${i}`);
    if (el) el.textContent = formatarValorMonitoramento(v, definicao);
    const titulo = document.getElementById(`gaugeTitle${i}`);
    if (titulo) titulo.textContent = i === 0 ? `Total · ${definicao.titulo}` : `Fase ${'ABC'[i - 1]}`;
  });
  const resumo = document.getElementById('monitorSummary');
  if (resumo) resumo.innerHTML = `<div class="monitor-summary-item"><span>Leitura atual</span><b>${formatarValorMonitoramento(valoresAtuais.total, definicao)}</b></div><div class="monitor-summary-item"><span>Dados na janela</span><b>${possuiHistorico ? `${ordered.length} leituras` : 'Sem histórico'}</b></div><div class="monitor-summary-item"><span>Última atualização</span><b>${latest?.created_at ? new Date(latest.created_at).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}) : 'Indisponível'}</b></div>`;
  if (status) status.textContent = possuiHistorico ? `${ordered.length} leituras exibidas nos últimos ${minutos} minuto${minutos === 1 ? '' : 's'}.` : 'Não há histórico nesta janela; exibindo a última leitura disponível.';
}
function atualizarMonitoramento(){
  drawMonitor();
}
function definirJanelaMonitoramento(minutos){
  const campo = document.getElementById('monitorWindow');
  if (campo) campo.value = minutos;
  drawMonitor();
}
function exportarMonitoramentoCsv(){
  const metrica = document.getElementById('metricSelect')?.value || localStorage.getItem('svoltix_monitor_metric') || 'pt';
  const definicao = METRICAS_MONITORAMENTO[metrica] || METRICAS_MONITORAMENTO.pt;
  const linhas = leiturasMonitor.length ? leiturasMonitor : [currentDevice()];
  const csv = [['data_hora','total','fase_a','fase_b','fase_c','unidade'], ...linhas.map(linha => {
    const valores = valoresDaGrandeza(linha, metrica);
    return [linha.created_at || '', valores.total, valores.fases[0], valores.fases[1], valores.fases[2], definicao.unidade];
  })].map(linha => linha.map(valor => `"${String(valor ?? '').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  const url = URL.createObjectURL(blob);
  link.href = url;
  link.download = `svoltix_monitoramento_${metrica}_${today()}.csv`;
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 0);
  toast('Leituras exportadas em CSV');
}
async function loadHistory(){
  const dev = document.getElementById('histDevice')?.value || ensureSelectedDevice();
  if (dev !== selectedDeviceId) {
    selectedDeviceId = dev;
    localStorage.setItem('svoltix_device', dev);
  }
  const metric = document.getElementById('histMetric')?.value || 'pt';
  const seconds = Math.min(Math.max(parseInt(document.getElementById('histWindow')?.value, 10) || 300, 1), 30 * 24 * 3600);
  localStorage.setItem('svoltix_window_seconds', seconds);
  const out = document.getElementById('histOutput');
  out.className = '';
  out.innerHTML = panel(`Resultado historico - ${deviceName(currentDevice())} - ultimos ${seconds}s`, '<div class="chart-box tall"><canvas id="histChart"></canvas></div>');
  try {
    const rows = await fetchHistoryByWindow(dev, seconds);
    historyRows = Array.isArray(rows) && rows.length ? rows : demoDevices();
  } catch { historyRows = demoDevices(); }
  const ordered = rowsAsc(historyRows);
  const labels = rowLabels(ordered);
  const data = ordered.map(r => Number(r[metric] || r.pt || 0));
  makeLine('histChart', labels, [{ label: metric.toUpperCase(), data, borderColor:'#23628f', backgroundColor:'rgba(35,98,143,.08)', fill:true, tension:.3 }], metric);
}
async function drawAnalysis(){
  const dev = document.getElementById('anaDevice')?.value || ensureSelectedDevice();
  if (dev !== selectedDeviceId) {
    selectedDeviceId = dev;
    localStorage.setItem('svoltix_device', dev);
  }
  let rows = [];
  try { rows = await fetchHistoryByWindow(selectedDeviceId, localStorage.getItem('svoltix_window_seconds') || 300); }
  catch { rows = [currentDevice()]; }
  const ordered = rowsAsc(rows.length ? rows : [currentDevice()]);
  const values = ordered.map(r => Number(r.pt || 0));
  const avg = values.length ? values.reduce((a,b)=>a+b,0) / values.length : 0;
  const out = document.getElementById('analysisOutput');
  out.className = '';
  out.innerHTML = `<div class="cards grid-2">${panel(`Curva de consumo - ${deviceName(currentDevice())}`, '<div class="chart-box"><canvas id="analysisChart"></canvas></div>')}${panel('Resumo', `<div class="metric-list"><div class="metric-line"><span>Media</span><b>${num(avg/1000,2)} kW</b></div><div class="metric-line"><span>Pico</span><b>${num((Math.max(...values,0))/1000,2)} kW</b></div><div class="metric-line"><span>Fator de potencia</span><b>${num(totals().fp,2)}</b></div></div>`)}</div>`;
  makeLine('analysisChart', rowLabels(ordered), [{ label:'Consumo', data:values, borderColor:'#23628f', tension:.35 }], 'W');
}
function drawGeneration(){
  const out = document.getElementById('generationOutput');
  out.className = '';
  out.innerHTML = panel('Geracao por periodo', '<div class="chart-box"><canvas id="generationChart"></canvas></div>');
  makeLine('generationChart', Array.from({length:12}, (_,i)=>`${i+6}h`), [{ label:'Geracao', data:fakeSeries('pt',12).map(v=>v*.42), borderColor:'#34d399', backgroundColor:'rgba(52,211,153,.1)', fill:true, tension:.35 }], 'W');
}
function exportCSV(){
  const rows = historyRows.length ? historyRows : devices;
  const cols = ['created_at','device','va','vb','vc','ia','ib','ic','pa','pb','pc','pt','fpt','hz','tc'];
  const csv = [cols.join(','), ...rows.map(r => cols.map(c => `"${String(r[c] ?? '').replace(/"/g,'""')}"`).join(','))].join('\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `svoltix_export_${today()}.csv`;
  a.click();
  a.remove();
  toast('CSV exportado');
}
function saveSettings(){
  const name = document.getElementById('cfgAreaName')?.value.trim();
  const goal = document.getElementById('cfgGoal')?.value;
  if (goal) localStorage.setItem('svoltix_goal', goal);
  if (!selectedCfgDevice || !name) { toast('Informe o nome da empresa ou instalação'); return; }
  groupNames[selectedCfgDevice] = name;
  fetch(`${API}/grupos`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ dispositivo: selectedCfgDevice, nome_grupo: name })
  })
    .then(r => {
      if (!r.ok) throw new Error('save');
      toast('Configurações salvas');
      renderAll();
      go('config');
    })
    .catch(() => toast('Não foi possível salvar as configurações'));
}
function filtrarEquipamentosConfiguracao(){
  const busca = (document.getElementById('configDeviceSearch')?.value || '').trim().toLowerCase();
  const itens = [...document.querySelectorAll('[data-config-device]')];
  let exibidos = 0;
  itens.forEach(item => {
    const visivel = !busca || (item.dataset.configSearch || '').includes(busca);
    item.hidden = !visivel;
    if (visivel) exibidos += 1;
  });
  const vazio = document.getElementById('configDeviceEmpty');
  if (vazio) vazio.hidden = exibidos > 0;
}
function selectCfgDevice(id){
  selectedCfgDevice = id;
  renderConfig();
}
function sair(){
  localStorage.removeItem('logado');
  location.href = 'index.html';
}
function init(){
  aplicarTemaSalvo();
  try { if (localStorage.getItem('svoltix-menu-compacto') === '1' && window.innerWidth > 980) document.body.classList.add('sidebar-collapsed'); } catch (_) {}
  document.getElementById('userName').textContent = localStorage.getItem('usuario') || 'IST EFICIENCIA';
  renderNav();
  loadGroupNames().then(() => refreshData(true));
  setInterval(() => refreshData(false), 30000);
}
init();
